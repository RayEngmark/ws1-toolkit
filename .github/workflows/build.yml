name: Build WS1 Toolkit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Opt actions/* in to Node 24 now — Node 20 is deprecated and forced-off
# by GitHub on 2026-06-02. Catching breakage early beats a surprise CI
# break the day before a build is needed.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set build version
        shell: bash
        run: |
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version='0.1.${{ github.run_number }}';fs.writeFileSync(f,JSON.stringify(j,null,2));"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
